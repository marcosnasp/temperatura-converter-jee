global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: "temperatura-converter"

scrape_configs:
  - job_name: "temperatura-converter-jee"
    metrics_path: /metrics
    scrape_interval: 10s
    fallback_scrape_protocol: "PrometheusText0.0.4"
    static_configs:
      - targets: ["jee:9990"]
        labels:
          service: "temperatura-converter-jee"
          app: "jee-wildfly32"

  - job_name: "temperatura-converter-jee-per-endpoint"
    metrics_path: /temperatura/metrics-per-endpoint
    scrape_interval: 5s
    static_configs:
      - targets: ["jee:8080"]
        labels:
          service: "temperatura-converter-jee"

  - job_name: "otel-collector"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"
        # ponytail: 8888 (collector self-telemetry) removido — sem service.telemetry.metrics pull

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
