receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: ["os"]

exporters:
  # Traces -> debug (trocar por tempo/jaeger quando houver backend)
  debug:
    verbosity: basic
  # Metrics -> Prometheus (exposto em :8889)
  prometheus:
    endpoint: "0.0.0.0:8889"
    send_timestamps: true
  # Opcional: OTLP para Tempo/Jaeger futuro
  # otlp/jaeger:
  #   endpoint: jaeger:4317
  #   tls:
  #     insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
  # ponytail: telemetry dedicado removido — usa padrão do collector (logs info, metrics sem prometheus pull)
  telemetry:
    logs:
      level: info
