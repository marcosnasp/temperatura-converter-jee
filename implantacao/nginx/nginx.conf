# Nginx como balanceador / reverse-proxy + TLS termination
# Domínios: jee.lab.dev, grafana.lab.dev, prometheus.lab.dev, otel.lab.dev
# Projeto: temperatura-converter-jee (WildFly 31) — sem Spring Boot
# Certificado autoassinado: /etc/nginx/certs/lab.dev.crt (SAN *.lab.dev cobre jee.lab.dev)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'host=$host upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Upstreams (para futuro balanceamento: adicione mais servidores aqui)
    upstream jee_backend {
        server jee:8080;
    }
    upstream grafana_backend {
        server grafana:3000;
    }
    upstream prometheus_backend {
        server prometheus:9090;
    }
    upstream otel_backend {
        server otel-collector:13133;
    }

    # HTTP -> redirect para HTTPS
    server {
        listen 80;
        server_name jee.lab.dev grafana.lab.dev prometheus.lab.dev otel.lab.dev *.lab.dev;
        return 301 https://$host$request_uri;
    }

    # ===== JEE (WildFly) ===== https://jee.lab.dev -> jee:8080 =====
    server {
        listen 443 ssl;
        server_name jee.lab.dev;

        ssl_certificate /etc/nginx/certs/lab.dev.crt;
        ssl_certificate_key /etc/nginx/certs/lab.dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS opcional (descomente se quiser forçar HTTPS no browser)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # MP Metrics/Health estão na porta management 9990, não em 8080
        location /metrics {
            proxy_pass http://jee:9990;
            proxy_set_header Host $host;
        }
        location /health {
            proxy_pass http://jee:9990;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://jee_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # health do próprio nginx para este vhost
        location /nginx-health {
            access_log off;
            return 200 "ok jee\n";
            add_header Content-Type text/plain;
        }
    }

    # ===== GRAFANA ===== https://grafana.lab.dev -> grafana:3000 =====
    server {
        listen 443 ssl;
        server_name grafana.lab.dev;

        ssl_certificate /etc/nginx/certs/lab.dev.crt;
        ssl_certificate_key /etc/nginx/certs/lab.dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://grafana_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Grafana precisa de websocket para live
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /nginx-health {
            access_log off;
            return 200 "ok grafana\n";
            add_header Content-Type text/plain;
        }
    }

    # ===== PROMETHEUS ===== https://prometheus.lab.dev -> prometheus:9090 =====
    server {
        listen 443 ssl;
        server_name prometheus.lab.dev;

        ssl_certificate /etc/nginx/certs/lab.dev.crt;
        ssl_certificate_key /etc/nginx/certs/lab.dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://prometheus_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx-health {
            access_log off;
            return 200 "ok prometheus\n";
            add_header Content-Type text/plain;
        }
    }

    # ===== OTEL COLLECTOR (health/zpages) ===== https://otel.lab.dev -> otel-collector:13133 =====
    server {
        listen 443 ssl;
        server_name otel.lab.dev;

        ssl_certificate /etc/nginx/certs/lab.dev.crt;
        ssl_certificate_key /etc/nginx/certs/lab.dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://otel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Fallback para IP direto ou host desconhecido
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/nginx/certs/lab.dev.crt;
        ssl_certificate_key /etc/nginx/certs/lab.dev.key;
        return 404 "Unknown host - use jee.lab.dev, grafana.lab.dev, prometheus.lab.dev\n";
    }
}
